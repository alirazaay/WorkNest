services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: worknest
      MYSQL_ROOT_PASSWORD: worknest_local_root
    ports:
      - "3306:3306"
    volumes:
      - worknest_mysql:/var/lib/mysql
      - ./backend/docker/mysql-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pworknest_local_root"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 5000
      HOST: 0.0.0.0
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: worknest
      DB_USER: root
      DB_PASSWORD: worknest_local_root
      CLIENT_URL: http://localhost:5173
      JWT_ACCESS_SECRET: local-access-secret-change-this-value-123456789
      JWT_REFRESH_SECRET: local-refresh-secret-change-this-value-123456789
    ports:
      - "5000:5000"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  worknest_mysql:
